name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # PLAYWRIGHT_BASE_URL must be set as a repository secret or variable
      # (Settings -> Secrets and variables -> Actions) pointing at the
      # CallCenterUI deployment these tests target.
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || secrets.PLAYWRIGHT_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

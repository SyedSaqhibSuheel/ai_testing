<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Test Framework</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0a0b0f;
    --panel: #12141a;
    --panel-2: #171a21;
    --border: #23262f;
    --border-hover: #2f333e;
    --text: #eef0f4;
    --muted: #8b91a0;
    --muted-2: #5f6472;
    --accent: #6366f1;
    --accent-hover: #7678f4;
    --accent-soft: rgba(99, 102, 241, 0.12);
    --pass: #22c55e;
    --pass-soft: rgba(34, 197, 94, 0.13);
    --fail: #f4485e;
    --fail-soft: rgba(244, 72, 94, 0.13);
    --warn: #f0a83c;
    --warn-soft: rgba(240, 168, 60, 0.13);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 8px; border: 2px solid var(--bg); }

  #shell { display: flex; flex-direction: column; height: 100vh; }

  #header {
    height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  #brand .mark {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex; align-items: center; justify-content: center;
  }
  #brand .mark svg { width: 13px; height: 13px; }
  #brand .sub { color: var(--muted); font-weight: 400; margin-left: 2px; }
  #provider-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-2);
  }
  #provider-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pass); }

  #app { display: flex; flex: 1; min-height: 0; }
  #sidebar { width: 340px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg); }

  #new-run { padding: 18px; border-bottom: 1px solid var(--border); }
  .field-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 7px; }
  #new-run textarea, #new-run input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 13px; padding: 9px 11px; font-family: inherit; margin-bottom: 14px; resize: vertical;
    transition: border-color 0.15s ease;
  }
  #new-run textarea { min-height: 76px; line-height: 1.45; }
  #new-run textarea:focus, #new-run input:focus { outline: none; border-color: var(--accent); }
  #new-run textarea::placeholder, #new-run input::placeholder { color: var(--muted-2); }
  #new-run button {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #new-run button:hover:not(:disabled) { background: var(--accent-hover); }
  #new-run button:disabled { opacity: 0.55; cursor: not-allowed; }
  #new-run-error { color: var(--fail); font-size: 12px; margin-top: 10px; }

  #runs-header {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-2);
    padding: 16px 18px 8px;
  }
  .run-item { padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s ease; position: relative; }
  .run-item:hover { background: var(--panel); }
  .run-item.active { background: var(--panel); }
  .run-item.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .run-item .req { font-size: 13px; margin-bottom: 6px; line-height: 1.4; color: var(--text); }
  .run-item .meta { font-size: 11px; color: var(--muted-2); display: flex; align-items: center; gap: 6px; }
  .run-item .meta .pass-count { color: var(--muted); font-family: var(--mono); }

  #main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 32px; min-width: 0; }
  .empty-state { color: var(--muted); padding: 80px 20px; text-align: center; font-size: 13px; }
  .empty-state .empty-icon { margin-bottom: 14px; opacity: 0.5; }

  .running-banner {
    background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 0 0 1px var(--accent-soft);
  }
  .spinner {
    width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .run-title { font-size: 19px; font-weight: 600; margin: 0 0 6px 0; letter-spacing: -0.01em; }
  .run-subtitle { color: var(--muted); font-size: 12.5px; margin-bottom: 22px; font-family: var(--mono); }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .stat-card .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }
  .stat-card.pass .stat-value { color: var(--pass); }
  .stat-card.fail .stat-value { color: var(--fail); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  thead th { background: var(--panel-2); color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tr.scenario-row { cursor: pointer; transition: background 0.12s ease; }
  tr.scenario-row:hover { background: var(--panel-2); }
  tr.scenario-row .chevron { display: inline-block; transition: transform 0.15s ease; color: var(--muted-2); margin-right: 6px; font-size: 10px; }
  tr.scenario-row.open .chevron { transform: rotate(90deg); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge.PASS { background: var(--pass-soft); color: var(--pass); }
  .badge.PASS .dot { background: var(--pass); }
  .badge.FAIL { background: var(--fail-soft); color: var(--fail); }
  .badge.FAIL .dot { background: var(--fail); }
  .badge.INCONCLUSIVE, .badge.TIMEOUT { background: var(--warn-soft); color: var(--warn); }
  .badge.INCONCLUSIVE .dot, .badge.TIMEOUT .dot { background: var(--warn); }
  .badge.REAL_DEFECT { background: var(--fail-soft); color: var(--fail); }
  .badge.REAL_DEFECT .dot { background: var(--fail); }
  .badge.UI_LOCATOR_CHANGE { background: var(--warn-soft); color: var(--warn); }
  .badge.UI_LOCATOR_CHANGE .dot { background: var(--warn); }
  .badge.TEST_SCRIPT_ERROR { background: rgba(139,148,158,0.14); color: var(--muted); }
  .badge.TEST_SCRIPT_ERROR .dot { background: var(--muted); }
  .badge.ENVIRONMENT_ERROR { background: var(--accent-soft); color: #a5a8ff; }
  .badge.ENVIRONMENT_ERROR .dot { background: var(--accent); }
  .no-value { color: var(--muted-2); }

  .detail-row td { padding: 0; background: #0d0f14; }
  .detail { padding: 20px 22px 22px 40px; font-size: 13px; }
  .detail-section { margin-bottom: 18px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail h3 { margin: 0 0 8px 0; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; font-weight: 600; }
  .detail-text { color: var(--text); line-height: 1.5; }
  .detail pre {
    background: #08090c; border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius-sm);
    overflow-x: auto; font-size: 12px; max-height: 320px; max-width: 100%; font-family: var(--mono); line-height: 1.5; color: #c9cdd6;
  }
  .evidence-kind { display: inline-block; font-size: 10px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); margin-left: 8px; font-weight: 500; text-transform: none; }
  .screenshots { display: flex; gap: 10px; flex-wrap: wrap; }
  .screenshots img { max-width: 240px; border: 1px solid var(--border); border-radius: var(--radius-sm); display: block; }

  @media (max-width: 900px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="header">
    <div id="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      AI Test Framework <span class="sub">&middot; fidar-server + CallCenterUI</span>
    </div>
    <div id="provider-badge"><span class="dot"></span><span id="provider-label">-</span></div>
  </div>
  <div id="app">
    <div id="sidebar">
      <div id="new-run">
        <label class="field-label" for="req-input">Requirement</label>
        <textarea id="req-input" placeholder="e.g. A helpdesk agent must be able to search for a customer and send an authorization request"></textarea>
        <label class="field-label" for="url-input">App URL</label>
        <input id="url-input" type="text" placeholder="https://callcenter.fidar.io" />
        <button id="generate-btn">Generate &amp; Run</button>
        <div id="new-run-error"></div>
      </div>
      <div id="runs-header">Runs</div>
      <div id="run-list"></div>
    </div>
    <div id="main">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 12h8M8 8h8M8 16h5"></path></svg>
        </div>
        Select a run on the left, or start a new one above.
      </div>
    </div>
  </div>
</div>
<script>
let currentRunId = null;
let pollTimer = null;

async function init() {
  try {
    const cfg = await fetch("/api/config").then(r => r.json());
    document.getElementById("url-input").value = cfg.appBaseUrl || "";
    document.getElementById("provider-label").textContent = cfg.llmProvider || "unknown";
  } catch {}

  await loadRuns();

  const active = await fetch("/api/jobs/active").then(r => r.json()).catch(() => null);
  if (active && active.status === "running") {
    setFormDisabled(true);
    showRunningBanner(active);
    pollJob(active.runId);
  }
}

function setFormDisabled(disabled) {
  const btn = document.getElementById("generate-btn");
  btn.disabled = disabled;
  btn.innerHTML = disabled ? '<span class="spinner" style="width:13px;height:13px;border-width:2px"></span> Running...' : "Generate &amp; Run";
}

function showRunningBanner(job) {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="running-banner">
      <div class="spinner"></div>
      <div>
        <div><strong>Running:</strong> ${escapeHtml(job.requirement)}</div>
        <div class="run-subtitle" style="margin:4px 0 0 0">Against ${escapeHtml(job.appBaseUrl)} - this can take a few minutes (real browser + LLM calls per step).</div>
      </div>
    </div>
  `;
}

async function generateAndRun() {
  const requirement = document.getElementById("req-input").value.trim();
  const appBaseUrl = document.getElementById("url-input").value.trim();
  const errorEl = document.getElementById("new-run-error");
  errorEl.textContent = "";

  if (!requirement) {
    errorEl.textContent = "Enter a requirement first.";
    return;
  }

  setFormDisabled(true);
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ requirement, appBaseUrl }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || "Failed to start run.";
      setFormDisabled(false);
      return;
    }
    showRunningBanner({ requirement, appBaseUrl: appBaseUrl || "(default)" });
    pollJob(data.runId);
  } catch (err) {
    errorEl.textContent = "Request failed: " + err;
    setFormDisabled(false);
  }
}

function pollJob(runId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const job = await fetch(`/api/jobs/${runId}`).then(r => r.json()).catch(() => null);
    if (!job) return;
    if (job.status === "running") return;

    clearInterval(pollTimer);
    pollTimer = null;
    setFormDisabled(false);

    if (job.status === "error") {
      document.getElementById("main").innerHTML = `<div class="empty-state" style="color:var(--fail)">Run failed: ${escapeHtml(job.error || "unknown error")}</div>`;
      return;
    }

    await loadRuns();
    await selectRun(job.runId);
  }, 3000);
}

async function loadRuns() {
  const res = await fetch("/api/runs");
  const runs = await res.json();
  const list = document.getElementById("run-list");
  list.innerHTML = "";
  if (runs.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:24px 18px">No runs yet - use the form above.</div>';
    return;
  }
  for (const run of runs) {
    const div = document.createElement("div");
    div.className = "run-item" + (run.runId === currentRunId ? " active" : "");
    const passCount = run.scenarios.filter(s => s.status === "PASS").length;
    div.innerHTML = `<div class="req">${escapeHtml(run.requirement)}</div>
      <div class="meta"><span class="pass-count">${passCount}/${run.scenarios.length}</span> passed &middot; ${formatRelativeTime(run.startedAt)}</div>`;
    div.onclick = () => selectRun(run.runId);
    list.appendChild(div);
  }
}

function formatRelativeTime(iso) {
  try {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.round(hrs / 24) + "d ago";
  } catch { return ""; }
}

async function selectRun(runId) {
  currentRunId = runId;
  await loadRuns();
  const res = await fetch(`/api/runs/${runId}`);
  const detail = await res.json();
  renderDetail(detail);
}

function classBadge(cls) {
  if (!cls) return "";
  return `<span class="badge ${cls}"><span class="dot"></span>${cls}</span>`;
}

function statusBadge(status) {
  return `<span class="badge ${status}"><span class="dot"></span>${status}</span>`;
}

function renderDetail(detail) {
  const main = document.getElementById("main");
  const total = detail.scenarios.length;
  const passed = detail.scenarios.filter(s => s.result.status === "PASS").length;
  const failed = detail.scenarios.filter(s => s.result.status !== "PASS").length;
  const passRate = total > 0 ? Math.round((passed / total) * 100) : 0;

  const rows = detail.scenarios.map(s => {
    const scenario = detail.plan.scenarios.find(sc => sc.id === s.scenarioId) || {};
    const cls = s.classification;
    return `
      <tr class="scenario-row" data-id="${s.scenarioId}">
        <td><span class="chevron">&#9656;</span>${escapeHtml(scenario.title || s.scenarioId)}</td>
        <td>${statusBadge(s.result.status)}</td>
        <td>${cls ? classBadge(cls.classification) + `<span class="evidence-kind">${cls.evidenceKind}</span>` : '<span class="no-value">-</span>'}</td>
        <td>${cls ? Math.round(cls.confidence * 100) + "%" : '<span class="no-value">-</span>'}</td>
      </tr>
      <tr class="detail-row" data-detail-for="${s.scenarioId}" style="display:none"><td colspan="4"></td></tr>
    `;
  }).join("");

  main.innerHTML = `
    <h2 class="run-title">${escapeHtml(detail.summary.requirement)}</h2>
    <div class="run-subtitle">${detail.summary.runId} &middot; started ${detail.summary.startedAt}</div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Scenarios</div></div>
      <div class="stat-card pass"><div class="stat-value">${passed}</div><div class="stat-label">Passed</div></div>
      <div class="stat-card fail"><div class="stat-value">${failed}</div><div class="stat-label">Failed</div></div>
      <div class="stat-card"><div class="stat-value">${passRate}%</div><div class="stat-label">Pass rate</div></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Scenario</th><th>Status</th><th>Classification</th><th>Confidence</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;

  main.querySelectorAll(".scenario-row").forEach(row => {
    row.onclick = () => toggleScenario(row.dataset.id, detail);
  });
}

function toggleScenario(scenarioId, detail) {
  const rowEl = document.querySelector(`tr.scenario-row[data-id="${scenarioId}"]`);
  const detailRow = document.querySelector(`tr[data-detail-for="${scenarioId}"]`);
  const isOpen = detailRow.style.display !== "none";
  document.querySelectorAll(".detail-row").forEach(r => r.style.display = "none");
  document.querySelectorAll(".scenario-row").forEach(r => r.classList.remove("open"));
  if (isOpen) return;

  rowEl.classList.add("open");
  const s = detail.scenarios.find(sc => sc.scenarioId === scenarioId);
  const cell = detailRow.querySelector("td");
  const screenshots = (s.screenshotFiles || []).map(f =>
    `<img src="/runs/${detail.summary.runId}/scenarios/${scenarioId}/screenshots/${f}" alt="${f}" />`
  ).join("");

  cell.innerHTML = `
    <div class="detail">
      <div class="detail-section">
        <h3>Summary</h3>
        <div class="detail-text">${escapeHtml(s.result.summary)}</div>
      </div>
      ${s.classification ? `
        <div class="detail-section">
          <h3>Classifier reasoning</h3>
          <div class="detail-text">${escapeHtml(s.classification.reasoning)}</div>
        </div>
        <div class="detail-section">
          <h3>Evidence</h3>
          <pre>${escapeHtml((s.classification.evidence || []).join("\\n"))}</pre>
        </div>
        ${s.classification.suggestedFix ? `<div class="detail-section"><h3>Suggested fix</h3><div class="detail-text">${escapeHtml(s.classification.suggestedFix)}</div></div>` : ""}
      ` : ""}
      <div class="detail-section">
        <h3>Step outcomes</h3>
        <pre>${escapeHtml(JSON.stringify(s.result.stepOutcomes, null, 2))}</pre>
      </div>
      <div class="detail-section">
        <h3>Network log</h3>
        <pre>${escapeHtml(JSON.stringify(s.result.networkLog || [], null, 2))}</pre>
      </div>
      <div class="detail-section">
        <h3>Transcript</h3>
        <pre>${escapeHtml(JSON.stringify(s.transcript, null, 2))}</pre>
      </div>
      ${screenshots ? `<div class="detail-section"><h3>Screenshots</h3><div class="screenshots">${screenshots}</div></div>` : ""}
    </div>
  `;
  detailRow.style.display = "";
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("generate-btn").addEventListener("click", generateAndRun);
init();
</script>
</body>
</html>
